name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Baseline evals
        run: dq-sentinel evals --agent baseline --suite core --strict

  claude-evals:
    # Runs the real agent only when the repo has an ANTHROPIC_API_KEY secret.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Claude agent evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          dq-sentinel evals --agent claude --save-reports reports | tee evals.md
          cat evals.md >> "$GITHUB_STEP_SUMMARY"
      - name: Print incident reports
        if: always()
        run: |
          for f in reports/*.md; do echo "=====BEGIN $f====="; cat "$f"; echo "=====END $f====="; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-incident-reports
          path: reports/

  kafka-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait redpanda
      - run: docker compose build
      - name: Produce 6 healthy batches + 1 schema-drift batch
        run: docker compose run --rm producer --scenario schema_drift_rename --healthy-batches 6 --batch-size 300 --interval 0
      - name: Consume and investigate
        run: |
          set -o pipefail
          docker compose run --rm sentinel --batch-size 300 --agent baseline --max-batches 7 | tee out.txt
          grep -q "schema_drift" out.txt
      - if: always()
        run: docker compose down -v
