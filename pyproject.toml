[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-sentinel"
version = "0.1.0"
description = "Streaming data-quality pipeline with a Claude agent that investigates failures and proposes data-contract fixes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Justin Jang" }]
dependencies = [
  "pyiceberg[sql-sqlite,pyarrow]>=0.9",
  "duckdb>=1.1",
  "pyarrow>=16",
  "pyyaml>=6",
  "anthropic>=0.40",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dq-sentinel = "dq_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
